# Puts every change pushed to a claude/... branch straight onto main, so the
# live site updates without anyone opening or merging a pull request.
name: Publish to main

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: publish-to-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge the pushed branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/$BRANCH"
          git push origin main
